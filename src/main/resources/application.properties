# =========================================================
# 1. CẤU HÌNH KẾT NỐI DATABASE (MySQL)
# =========================================================
# Tên Database: shop_api, chạy ở cổng 3306 mặc định
spring.datasource.url=jdbc:mysql://localhost:3306/shop_api?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# 2. CẤU HÌNH HIBERNATE / JPA
# =========================================================
# Tự động cập nhật / đồng bộ bảng từ Java Entities sang Database mà không xóa dữ liệu cũ
spring.jpa.hibernate.ddl-auto=update

# Hiển thị và định dạng các câu lệnh SQL trên màn hình console khi ứng dụng chạy
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chỉ định dialect cho MySQL 8 (hoặc MariaDB)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================================
# 3. CẤU HÌNH APP & JWT (Dùng cho lớp Bảo mật sau này)
# =========================================================
server.port=8080
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Key mã hóa JWT (Tối thiểu 256-bit / 32 ký tự)
jwt.secret=9a2f8c4e1b7d5a0e3f8c4b1a7d0e9f2a4b8c1d7e0a3f6b9c2d5e8f1a4b7c0d3e
# Thời gian hết hạn của Token (86400000 ms = 24 giờ)
jwt.expiration=86400000
